name: OutreachOS queue worker (manual)

# The worker is scheduled by Supabase Cron (migration 009): it runs on time, inside the
# database, and uses no GitHub Actions minutes. GitHub's own `schedule` trigger is best-effort
# (runs are delayed or dropped under load), so it is no longer used.
#
# This workflow remains as a manual "run the worker now" button: Actions → Run workflow.
on:
  workflow_dispatch: {}

concurrency:
  group: outreach-os-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger /api/cron/process-queue
        env:
          OUTREACH_OS_URL: ${{ secrets.OUTREACH_OS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 90 \
            "${OUTREACH_OS_URL%/}/api/cron/process-queue"
